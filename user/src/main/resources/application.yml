# $schema: https://json.schemastore.org/spring-boot-application.json
server:
  port: 8081

spring:
  application:
    name: user

  datasource:
    url: jdbc:mysql://localhost:3306/userdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: TestdbRoot
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

