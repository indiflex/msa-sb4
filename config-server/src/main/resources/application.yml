# $schema: https://json.schemastore.org/spring-boot-application.json
server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/indiflex/msa-config
          default-label: master
          search-paths: configs
          username: indiflex
          password: ${GIT_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
